<!DOCTYPE html>
<html lang="tr">
<head>

<meta property="og:title" content="MATRANÇ – Matematiğin yeni hamlesi.">

<style>
  :root { --lacivert: #242e60; --kirmizi: #e23b3b; --mavi: #2f8cf0; --yesil: #2fb35a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Poppins", system-ui, sans-serif; color: #fff;
    background: #2a4a9a url("zemin.jpg") center top / cover no-repeat fixed;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .perde { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(10,20,60,.15), rgba(10,20,60,.55)); pointer-events: none; }
  main { position: relative; width: 100%; max-width: 460px; padding: 28px 18px 32px; display: flex; flex-direction: column; align-items: center; }
  .logo { width: 100%; max-width: 400px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  .slogan { margin: 6px 0 0; font-size: 22px; font-weight: 800; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,.45); }
  .alt { font-size: 14px; font-weight: 600; opacity: .9; text-align: center; margin-bottom: 26px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .dugme {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 20px; margin-bottom: 14px;
    border-radius: 22px; text-decoration: none; color: #fff; font-weight: 800; font-size: 19px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
    transition: transform .08s ease;
  }
  .dugme:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35); }
  .dugme small { display: block; font-size: 12px; font-weight: 600; opacity: .9; }
  .ikon { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
  .ikon svg { width: 26px; height: 26px; }
  .ios { background: linear-gradient(180deg, #3a3f4b, #1d2028); }
  .android { background: linear-gradient(180deg, #34c26a, #1f9a4c); }
  .tahta { background: linear-gradient(180deg, #ff5a5a, #c92a2a); }
  .not { margin-top: 14px; font-size: 12.5px; text-align: center; opacity: .9; line-height: 1.5; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
  .bosluk { flex: 1; min-height: 40px; }
  footer { margin-top: 26px; font-size: 12px; opacity: .8; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div class="perde"></div>
<main>
  <img class="logo" src="logo.png" alt="MATRANÇ – Stratejik Çarpma Oyunu">
  <p class="slogan">Matematiğin yeni hamlesi.</p>
  <div class="bosluk"></div>

  <a class="dugme ios" href="https://apps.apple.com/app/id6827108845">

    <span>App Store<small>iPhone için indir.</small></span>
  </a>

  <a class="dugme android" href="https://play.google.com/store/apps/details?id=com.matranc.oyun">
    <span class="ikon"><svg viewBox="0 0 24 24"><path fill="#1f9a4c" d="M3.6 1.8 13.5 12 3.6 22.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1zm11.3 11.6 2.6 2.6-11.3 6.5 8.7-9.1zm3.9-3.8 2.6 1.5c.8.5.8 1.3 0 1.8l-2.6 1.5-2.9-2.9 2.9-1.9zM6.2 1.5l11.3 6.5-2.6 2.6-8.7-9.1z"/></svg></span>
    <span>Google Play<small>Android telefon ve tablet için indir.</small></span>

  </a>

  <p class="not">Akıllı tahtada iki oyunculu mod tarayıcıda açılır.</p>
  <footer>© 2026 MATRANÇ</footer>

</body>
</html>
